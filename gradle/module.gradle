apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'
apply plugin: 'io.freefair.lombok'
apply plugin: 'com.adarshr.test-logger'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:deprecation'
}

javadoc {
    options.addBooleanOption('Xdoclint:none', true)
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:4.1.2"

    testFixturesApi "org.springframework.boot:spring-boot-starter-test:3.0.0"
    testFixturesApi "org.springframework.boot:spring-boot-starter-web:3.0.0"
    testFixturesApi "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.4"
    testFixturesApi platform("org.junit:junit-bom:6.1.3")
    testFixturesApi "org.junit.jupiter:junit-jupiter-api"
    testFixturesApi "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}

jar {
    manifest {
        attributes(
                'Implementation-Title': rootProject.name,
                'Implementation-Version': project.version,
                'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Compatibility': project.java.sourceCompatibility,
                'Built-By': System.getProperty('user.name')
        )
    }
}

test {
    useJUnitPlatform()
    ignoreFailures = rootProject.version.endsWith('-SNAPSHOT')
}

// code coverage
apply plugin: 'jacoco'
jacoco.toolVersion = "0.8.16"
jacocoTestReport.reports {
    xml.required = true
    html.required = true
}
check.dependsOn(jacocoTestReport)
